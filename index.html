<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Content Security Policy（多層防御）: すべて同一オリジンに限定。
         インラインの theme ブートストラップは sha256 ハッシュで許可。
         ※ script を変更した場合はハッシュの再生成が必要。 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'sha256-8iYE7OviB2+MhtBXuVvEEz39fw6tOPbBdppI+gzuCKI='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'">

    <!-- MFI / PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RecipeBox">

    <!-- SEO -->
    <title>RecipeBox - 高機能レシピ管理システム | 材料計算・黒い砂漠対応</title>
    <meta name="description" content="複雑なレシピと材料の依存関係を効率的に管理。黒い砂漠やMMORPGのアイテム制作、料理レシピに最適。100個以上のレシピ対応、材料の自動計算機能を搭載した無料のウェブアプリケーション。">
    <meta name="author" content="NimaProgram">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="language" content="ja">
    <meta name="theme-color" content="#f5f3fb">
    <meta name="application-name" content="RecipeBox">
    <meta name="msapplication-TileColor" content="#4a90e2">
    <meta name="format-detection" content="telephone=no">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nimaprogram.github.io/Recipebox/">
    <meta property="og:title" content="RecipeBox - 黒い砂漠対応レシピ管理システム">
    <meta property="og:description" content="複雑なレシピと材料の依存関係を効率的に管理。黒い砂漠やMMORPGのアイテム制作、料理レシピに最適。100個以上のレシピ対応、材料の自動計算機能を搭載。">
    <meta property="og:image" content="https://nimaprogram.github.io/Recipebox/favicon.svg">
    <meta property="og:image:alt" content="RecipeBox - レシピ管理システムのロゴ">
    <meta property="og:site_name" content="RecipeBox">
    <meta property="og:locale" content="ja_JP">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://nimaprogram.github.io/Recipebox/">
    <meta property="twitter:title" content="RecipeBox - 黒い砂漠対応レシピ管理システム">
    <meta property="twitter:description" content="複雑なレシピと材料の依存関係を効率的に管理。黒い砂漠やMMORPGのアイテム制作、料理レシピに最適。">
    <meta property="twitter:image" content="https://nimaprogram.github.io/Recipebox/favicon.svg">
    <meta property="twitter:creator" content="@NimaProgram">
    <meta property="twitter:site" content="@NimaProgram">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
    <link rel="mask-icon" href="favicon.svg" color="#4a90e2">
    <link rel="canonical" href="https://nimaprogram.github.io/Recipebox/">
    <link rel="manifest" href="manifest.json">

    <!-- テーマの早期適用（フラッシュ防止） -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <!-- アイコン（自己ホスト: 第三者通信なし） -->
    <link rel="preload" href="assets/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/solid.min.css">

    <!-- フォントはシステムフォントスタックを使用（第三者通信なし） -->
    <link rel="stylesheet" href="styles.css">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RecipeBox",
        "alternateName": "RecipeBox - レシピ管理システム",
        "description": "複雑なレシピと材料の依存関係を効率的に管理できる高機能レシピ管理システム。黒い砂漠やMMORPGのアイテム制作に最適。",
        "url": "https://nimaprogram.github.io/Recipebox/",
        "applicationCategory": ["UtilityApplication", "GameApplication"],
        "operatingSystem": "Web Browser",
        "browserRequirements": "Requires JavaScript ES6+, HTML5, CSS3",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY", "availability": "https://schema.org/InStock" },
        "featureList": ["レシピ管理", "材料計算", "階層構造での材料展開", "JSONインポート・エクスポート", "ダークテーマ対応", "黒い砂漠レシピ対応", "PWA対応", "オフライン機能"],
        "author": { "@type": "Person", "name": "NimaProgram", "url": "https://github.com/NimaProgram" },
        "dateModified": "2025-10-10",
        "inLanguage": "ja",
        "keywords": ["黒い砂漠", "材料計算", "レシピ管理", "MMORPG", "アプリ", "料理レシピ"]
    }
    </script>
</head>
<body>
    <a href="#app" class="skip-link">メインコンテンツにスキップ</a>

    <header class="app-header" role="banner">
        <div class="app-header-inner">
            <div class="brand">
                <span class="brand-mark"><i class="fas fa-gamepad" aria-hidden="true"></i></span>
                <span class="brand-name">MMO Toolkit</span>
            </div>
            <nav class="module-nav" id="moduleNav" aria-label="モジュール切り替え">
                <!-- js/app.js がタブを描画します -->
            </nav>
            <button class="theme-toggle" id="helpBtn" type="button" aria-label="チュートリアルを表示" title="使い方（チュートリアル）">
                <i class="fas fa-circle-question" aria-hidden="true"></i>
            </button>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="テーマを切り替える" title="テーマを切り替える">
                <i class="fas fa-palette" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main class="app-main" id="app" role="main">
        <!-- 画面は js/app.js が描画します -->
    </main>

    <footer class="app-footer">
        <p>© 2025 MMO Toolkit</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
